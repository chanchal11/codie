[project]
name = "codie"
version = "0.1.0"
description = "Terminal coding agent with workspace guards, LangGraph, Ollama, Groq, and Bedrock."
readme = "README.md"
authors = [
    { name = "Chanchal Kumar", email = "rrabshrivastava@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.1",
    "langchain>=1.5.2",
    "langchain-aws>=1.10.0",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-ollama>=1.2.0",
    "langgraph>=1.2.24",
    "mcp>=1.2.0",
    "python-dotenv>=1.2.4",
    "textual>=8.2.8",
]

[project.scripts]
codie = "codie:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
